services:
  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrator
    restart: no
    exclude_from_hc: true
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?}
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    expose:
      - '5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:?}
      - TOKEN=${TOKEN:?}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/live']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: scheduler
    exclude_from_hc: true
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?}
      - GEMINI_API_KEY=${GEMINI_API_KEY:?}
      - MAILTRAP_API_TOKEN=${MAILTRAP_API_TOKEN:?}
    depends_on:
      migrator:
        condition: service_completed_successfully
