<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Price tag shape -->
  <path d="M10 10 L50 10 L90 50 L50 90 L10 50 Z" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>

  <!-- Tag hole -->
  <circle cx="25" cy="25" r="6" fill="#fff"/>

  <!-- Downward trend arrow -->
  <g stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chart line going down -->
    <polyline points="35,35 45,45 55,40 65,55"/>
    <!-- Arrow head -->
    <polyline points="60,55 65,55 65,50"/>
  </g>

  <!-- Dollar sign -->
  <g fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="bold">
    <text x="50" y="75" text-anchor="middle">$</text>
  </g>
</svg>
